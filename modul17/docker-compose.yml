version: '3.8'

services:
  tobblez-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tobblez_agent_container
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./db_data:/app/db_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s